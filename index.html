<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HROOT Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Hamburg Registration and Organization Online Tool - Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="icon" type="image/svg+xml" href="images/hroot_logo_rounded.svg">
  
  <!-- Classic clean Docsify theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    :root {
      --theme-color: #004994; /* Classic Hamburg / Academic Blue */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji" !important;
      font-size: 15px;
      color: #24292f;
      line-height: 1.6;
    }
    .sidebar {
      background-color: #f6f8fa;
      border-right: 1px solid #d0d7de;
      padding-top: 15px;
    }
    .app-name-link img {
      max-height: 48px;
      display: block;
      margin: 0 auto 12px auto;
    }
    .sidebar-nav ul {
      padding-left: 15px;
    }
    .sidebar-nav li {
      margin: 4px 0;
      font-size: 14px;
    }
    .sidebar-nav > ul > li > a {
      font-weight: 600;
      color: #24292f;
    }
    .markdown-section {
      max-width: 900px;
      padding: 30px 45px 50px 45px;
    }
    .markdown-section h1 {
      font-size: 28px;
      font-weight: 600;
      color: #1f2328;
      border-bottom: 1px solid #d8dee4;
      padding-bottom: 8px;
      margin-top: 0;
    }
    .markdown-section h2 {
      font-size: 22px;
      font-weight: 600;
      color: #1f2328;
      border-bottom: 1px solid #d8dee4;
      padding-bottom: 6px;
      margin-top: 32px;
    }
    .markdown-section h3 {
      font-size: 17px;
      font-weight: 600;
      color: #1f2328;
      margin-top: 24px;
    }
    .markdown-section code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace !important;
      background-color: #eff1f3;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 13px;
      color: #1f2328;
    }
    .markdown-section pre {
      background-color: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }
    .markdown-section pre code {
      background-color: transparent;
      padding: 0;
    }
    .markdown-section blockquote {
      border-left: 4px solid #d0d7de;
      color: #57606a;
      padding: 0 1em;
      margin: 16px 0;
    }
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 16px 0;
    }
    .markdown-section table th, .markdown-section table td {
      border: 1px solid #d0d7de;
      padding: 8px 12px;
    }
    .markdown-section table th {
      background-color: #f6f8fa;
      font-weight: 600;
    }
    .search input {
      border: 1px solid #d0d7de !important;
      border-radius: 6px !important;
      padding: 6px 10px !important;
      font-size: 13.5px !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading HROOT Documentation...</div>
  <script>
    window.$docsify = {
      name: '<img src="images/hroot_logo_rounded.svg" alt="HROOT Logo"><strong>HROOT Docs</strong>',
      repo: 'https://github.com/wiso-forschungslabor/hroot',
      homepage: 'Home.md',
      loadSidebar: '_sidebar.md',
      auto2top: true,
      subMaxLevel: 2,
      maxLevel: 3,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search wiki...',
        noData: 'No results found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    };
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy to Clipboard Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Zoom Image Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- Prism Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-ruby.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
